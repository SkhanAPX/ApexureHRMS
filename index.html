<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apexure HRMS v3</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet"/>
<!-- Supabase JS Client SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0D1B2A;--surface:#111F30;--surface2:#162840;--surface3:#1C3050;
--border:#1E3A5F;--border2:#265080;
--text:#E2EAF4;--muted:#7A95B0;--faint:#3A5878;
--accent:#4F6EF7;--accent-dim:rgba(79,110,247,.12);
--amber:#F6A823;--amber-dim:rgba(246,168,35,.1);
--red:#F05252;--red-dim:rgba(240,82,82,.1);
--green:#22C55E;--green-dim:rgba(34,197,94,.1);
--purple:#8B5CF6;--purple-dim:rgba(139,92,246,.1);
--teal:#06B6D4;--teal-dim:rgba(6,182,212,.1);
--font:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;--head:'Playfair Display',serif;
--sidebar:230px;--r:5px;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.5}
button,input,select,textarea{font-family:var(--font);font-size:13px}
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999}
.login-box{background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:36px 40px;width:390px}
.login-logo{font-family:var(--head);font-size:20px;color:var(--text);margin-bottom:4px}
.login-sub{font-size:11px;color:var(--muted);margin-bottom:28px}
.login-err{background:var(--red-dim);border:1px solid rgba(240,82,82,.2);color:var(--red);padding:8px 10px;border-radius:var(--r);font-size:11px;margin-bottom:12px;display:none}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.brand-name{font-family:var(--head);font-size:16px;color:var(--text)}
.brand-sub{font-size:10px;color:var(--muted);margin-top:2px}
.nav-group{padding:12px 8px 4px;font-size:10px;color:var(--faint);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.nav-btn{display:flex;align-items:center;gap:8px;width:calc(100% - 8px);margin:1px 4px;padding:7px 10px;border-radius:var(--r);background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;text-align:left;transition:all .15s}
.nav-btn:hover{background:var(--surface2);color:var(--text)}
.nav-btn.active{background:var(--accent-dim);color:var(--accent);font-weight:500}
.sidebar-footer{margin-top:auto;padding:10px 12px;border-top:1px solid var(--border)}
.notice{background:var(--amber-dim);border:1px solid rgba(246,168,35,.2);border-radius:var(--r);padding:8px 10px;font-size:10px;color:var(--amber);line-height:1.5}
.user-chip{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface2);border-radius:var(--r);margin-bottom:8px}
.user-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;flex-shrink:0}
.user-name{font-size:11px;font-weight:500;color:var(--text)}
.user-role{font-size:10px;color:var(--muted)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:48px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
.page-title{font-family:var(--head);font-size:17px;color:var(--text)}
.topbar-right{display:flex;align-items:center;gap:8px}
.content{flex:1;overflow-y:auto;padding:20px}
.section{display:none}.section.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:7px;margin-bottom:14px;overflow:hidden}
.card-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:600;color:var(--text)}
.card-body{padding:16px}
.form-row{display:grid;gap:12px;margin-bottom:12px}
.r3{grid-template-columns:1fr 1fr 1fr}
.fg{display:flex;flex-direction:column}
label{font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:7px 9px;color:var(--text);outline:none;width:100%}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:var(--r);font-size:12px;font-weight:500;border:none;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:10px;font-weight:600;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--border);text-transform:uppercase}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text);font-size:12px}
.alert{padding:9px 12px;border-radius:var(--r);font-size:11px;line-height:1.6;margin-bottom:12px;background:var(--amber-dim);border:1px solid rgba(246,168,35,.2);color:var(--amber)}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Apexure HRMS</div>
    <div class="login-sub">Apexure India Pvt. Ltd. · Sign in to continue</div>
    <div class="login-err" id="login-err">Invalid username or password.</div>
    <div class="form-row" style="margin-bottom:10px"><div class="fg"><label>Username</label><input type="text" id="login-user" value="superadmin"/></div></div>
    <div class="form-row" style="margin-bottom:18px"><div class="fg"><label>Password</label><input type="password" id="login-pass" value="admin123"/></div></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="doLogin()">Sign In</button>
  </div>
</div>

<div class="app" id="app-root" style="display:none">
  <nav class="sidebar">
    <div class="brand"><div class="brand-name">Apexure HRMS</div><div class="brand-sub">v3 · Supabase Live</div></div>
    <div class="nav-group">Core</div>
    <button class="nav-btn active" onclick="nav('dashboard')">Dashboard</button>
    <button class="nav-btn" onclick="nav('appraisal')">Appraisals</button>
    <div class="sidebar-footer">
      <button class="btn btn-secondary" style="width:100%;justify-content:center" onclick="doLogout()">Sign Out</button>
    </div>
  </nav>
  <div class="main">
    <div class="topbar"><span class="page-title" id="page-title">Appraisals</span></div>
    <div class="content">
      <div id="s-appraisal" class="section active">
        <div class="alert">Supabase Database Connection Active. Forms will write straight to your production tables.</div>
        <div class="card">
          <div class="card-head"><span class="card-title">Appraisal Form</span></div>
          <div class="card-body">
            <div class="form-row r3">
              <div class="fg"><label>Employee Name</label><input type="text" id="apr-emp" value="Riya Sharma"/></div>
              <div class="fg"><label>Appraisal Period</label><input type="text" id="apr-period" value="Annual 2024–25"/></div>
              <div class="fg"><label>Score (0-100)</label><input type="text" id="final-score" value="88"/></div>
            </div>
            <button class="btn btn-primary" onclick="saveAppraisal()">Save Appraisal to Supabase</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// Supabase Client Initialization
const SUPABASE_URL = 'https://pnovrrkykimjknqdhoww.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBub3Zycmt5a2ltamtub3Fkb3d3Iiwicm9sZSI6ImFub24iLCJpWFp...'; // using your active initialized client
const supabaseClient = window.supabase.createClient(SUPABASE_URL, 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBub3Zycmt5a2ltamtub3Fkb3d3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMzg3MTAsImV4cCI6MjA1NjgxNDcxMH0.example_key');

function doLogin(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-root').style.display='flex';
}
function doLogout(){
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app-root').style.display='none';
}
function nav(sec){
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('s-' + sec).classList.add('active');
}

// Fixed Supabase Save Function
async function saveAppraisal() {
  const appraisalData = {
    employee: document.getElementById('apr-emp').value,
    period: document.getElementById('apr-period').value,
    score: document.getElementById('final-score').value,
    timestamp: new Date().toISOString()
  };

  const { data, error } = await supabaseClient
    .from('appraisals')
    .insert([{ data: appraisalData }]);
  
  if (error) {
    alert("Database Error: " + error.message);
  } else {
    alert("Appraisal saved permanently to Supabase!");
  }
}
</script>
</body>
</html>
